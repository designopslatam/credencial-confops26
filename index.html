<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credencial ConfOps26</title>

  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#141414}
    .page{min-height:100vh;display:grid;grid-template-columns:40% 60%;align-items:center;gap:56px;padding:56px 72px}
    .form{max-width:460px}
    .block{margin-bottom:30px}
    h2{font-size:34px;font-weight:900;letter-spacing:-.04em;margin-bottom:28px}
    h3{font-size:28px;font-weight:900;letter-spacing:-.04em;margin-bottom:16px}
    p,.field-label{font-size:22px;color:#666;line-height:1.35;margin-bottom:16px}
    input[type="text"]{width:100%;height:54px;border:1.5px solid #cfcfcf;border-radius:14px;padding:0 20px;font-size:20px;outline:none}
    input[type="text"]::placeholder{color:#777}
    input[type="text"]:focus{border-color:#141414}
    input[type="file"]{display:none}
    .upload-btn{display:inline-flex;border:1.7px solid #141414;border-radius:14px;padding:16px 28px;font-size:20px;font-weight:800;cursor:pointer;background:#fff}
    .upload-btn:hover{background:#141414;color:#fff}
    .file-name{margin-top:12px;font-size:14px;color:#888;word-break:break-word}
    .swatches{display:flex;gap:18px;margin-top:18px}
    .swatch{width:64px;height:64px;border-radius:17px;border:2px solid transparent;cursor:pointer}
    .swatch.active{outline:4px solid #141414;outline-offset:4px}
    .white{background:#e9e9e9;border-color:#cfcfcf}
    .pink{background:#ff2d9b}
    .black{background:#141414}
    .blackpink{background:linear-gradient(180deg,#141414 0%,#ff2d9b 100%)}
    .download-btn,.share-btn{width:100%;border:none;border-radius:16px;padding:18px 24px;font-size:21px;font-weight:900;cursor:pointer}
    .download-btn{background:#141414;color:#fff;margin-top:28px}
    .download-btn:hover{background:#ff2d9b}
    .share-btn{background:#ff2d9b;color:#fff;margin-top:14px}
    .share-btn:hover{background:#141414}
    .share-help{font-size:14px;color:#777;margin-top:12px;line-height:1.4}
    .preview-area{display:flex;justify-content:center;align-items:center}
    .badge{width:min(520px,90vw);aspect-ratio:4/5;position:relative}
    .badge-bg{width:100%;height:100%;object-fit:contain;display:block}
    .photo{position:absolute;left:29.2%;top:28.3%;width:41.7%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:transparent}
    .photo img{width:100%;height:100%;object-fit:cover;object-position:center;display:none}
    .name{position:absolute;top:63.5%;left:50%;transform:translateX(-50%);width:86%;text-align:center;font-family:"Tiro Bangla",serif;font-size:clamp(24px,4.2vw,38px);line-height:1;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#151515}
    .badge.dark .name{color:#f2f2f2}
    @media(max-width:900px){
      .page{grid-template-columns:1fr;padding:36px 24px}
      h2{font-size:32px}
      h3{font-size:26px}
      p,.field-label{font-size:20px}
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="form">
      <div class="block">
        <h2>Datos personales:</h2>
        <div class="field-label">Nombre y apellido</div>
        <input id="nameInput" type="text" placeholder="Escribe aquí" maxlength="36">
      </div>

      <div class="block">
        <h3>Imagen:</h3>
        <p>Sube tu foto para reconocerte:</p>
        <label class="upload-btn" for="photoInput">Subir</label>
        <input id="photoInput" type="file" accept="image/*">
        <div class="file-name" id="fileName"></div>
      </div>

      <div class="block">
        <h3>Color:</h3>
        <p>Elige el color que más te guste para personalizar tu tarjeta:</p>
        <div class="swatches">
          <button class="swatch white active" data-badge="badge-white.png" data-theme="light"></button>
          <button class="swatch pink" data-badge="badge-pink.png" data-theme="light"></button>
          <button class="swatch black" data-badge="badge-black.png" data-theme="dark"></button>
          <button class="swatch blackpink" data-badge="badge-blackpink.png" data-theme="dark"></button>
        </div>
      </div>

      <button class="download-btn" id="downloadBtn">Descargar credencial</button>
      <button class="share-btn" id="shareBtn">Compartir en redes</button>
      <p class="share-help">Comparte tu credencial y etiqueta a @designopslatam usando #ConfOps26.</p>
    </section>

    <section class="preview-area">
      <div class="badge" id="badge">
        <img class="badge-bg" id="badgeBg" src="badge-white.png" alt="Credencial ConfOps26">
        <div class="photo"><img id="photoPreview" alt="Foto del participante"></div>
        <div class="name" id="namePreview">Nombre y apellido</div>
      </div>
    </section>
  </main>

  <script>
    const nameInput = document.getElementById("nameInput");
    const namePreview = document.getElementById("namePreview");
    const photoInput = document.getElementById("photoInput");
    const photoPreview = document.getElementById("photoPreview");
    const fileName = document.getElementById("fileName");
    const swatches = document.querySelectorAll(".swatch");
    const badgeBg = document.getElementById("badgeBg");
    const badge = document.getElementById("badge");
    const downloadBtn = document.getElementById("downloadBtn");
    const shareBtn = document.getElementById("shareBtn");
    const caption = "Yo voy a la #ConfOps26";

    nameInput.addEventListener("input", () => {
      const value = nameInput.value.trim();
      namePreview.textContent = value || "Nombre y apellido";
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;
      fileName.textContent = file.name;
      photoPreview.src = URL.createObjectURL(file);
      photoPreview.style.display = "block";
    });

    swatches.forEach(swatch => {
      swatch.addEventListener("click", () => {
        swatches.forEach(item => item.classList.remove("active"));
        swatch.classList.add("active");
        badgeBg.src = swatch.dataset.badge;
        badge.classList.toggle("dark", swatch.dataset.theme === "dark");
      });
    });

    async function generateBlob() {
      const canvas = await html2canvas(badge, {
        backgroundColor: null,
        scale: 3,
        useCORS: true
      });
      return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    }

    downloadBtn.addEventListener("click", async () => {
      const blob = await generateBlob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.download = "credencial-confops26.png";
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
    });

    shareBtn.addEventListener("click", async () => {
      const blob = await generateBlob();
      const file = new File([blob], "credencial-confops26.png", { type: "image/png" });

      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: "ConfOps26",
            text: caption,
            files: [file]
          });
        } else if (navigator.share) {
          await navigator.share({
            title: "ConfOps26",
            text: caption,
            url: window.location.href
          });
        } else {
          await navigator.clipboard.writeText(caption);
          alert("Caption copiado: " + caption);
        }
      } catch (error) {
        await navigator.clipboard.writeText(caption);
        alert("Caption copiado. Descarga tu credencial y compártela manualmente.");
      }
    });
  </script>
</body>
</html>
