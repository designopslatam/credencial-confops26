<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credencial ConfOps26</title>

  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #151515;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 40% 60%;
      align-items: center;
      padding: 56px 72px;
      gap: 48px;
    }

    .form { max-width: 420px; }
    .block { margin-bottom: 28px; }

    h2 {
      font-size: 28px;
      margin-bottom: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    h3 {
      font-size: 24px;
      margin-bottom: 14px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    p, .field-label {
      font-size: 18px;
      color: #666;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    input[type="text"] {
      width: 100%;
      height: 46px;
      border: 1.5px solid #cfcfcf;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 18px;
      outline: none;
    }

    input[type="text"]::placeholder { color: #8a8a8a; }
    input[type="text"]:focus { border-color: #151515; }
    input[type="file"] { display: none; }

    .upload-btn,
    .download-btn,
    .share-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1.5px solid #151515;
      background: #ffffff;
      color: #151515;
      font-size: 18px;
      font-weight: 700;
      padding: 14px 26px;
      cursor: pointer;
      text-decoration: none;
    }

    .upload-btn:hover {
      background: #151515;
      color: #ffffff;
    }

    .download-btn {
      width: 100%;
      margin-top: 20px;
      background: #151515;
      color: #ffffff;
    }

    .download-btn:hover {
      background: #ff2d9b;
      border-color: #ff2d9b;
    }

    .share-btn {
      width: 100%;
      margin-top: 12px;
      background: #ff2d9b;
      border-color: #ff2d9b;
      color: #ffffff;
    }

    .share-btn:hover {
      background: #151515;
      border-color: #151515;
    }

    .share-help {
      font-size: 13px;
      color: #777;
      margin-top: 10px;
      line-height: 1.4;
    }

    .share-panel {
      display: none;
      margin-top: 14px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .share-panel.active { display: flex; }

    .social-link {
      font-size: 13px;
      font-weight: 700;
      color: #151515;
      border: 1px solid #d0d0d0;
      border-radius: 999px;
      padding: 8px 12px;
      text-decoration: none;
      background: #fff;
    }

    .social-link:hover {
      border-color: #151515;
    }

    .file-name {
      margin-top: 10px;
      font-size: 14px;
      color: #888;
      word-break: break-word;
    }

    .swatches {
      display: flex;
      gap: 14px;
      margin-top: 20px;
    }

    .swatch {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .swatch.active {
      outline: 3px solid #151515;
      outline-offset: 3px;
    }

    .white { background: #e9e9e9; border-color: #cfcfcf; }
    .pink { background: #ff2d9b; }
    .black { background: #151515; }
    .blackpink { background: linear-gradient(180deg, #151515 0%, #ff2d9b 100%); }

    .preview-area {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .badge {
      width: min(520px, 90vw);
      aspect-ratio: 4 / 5;
      position: relative;
      overflow: hidden;
    }

    .badge-bg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .photo {
      position: absolute;
      left: 29.2%;
      top: 28.3%;
      width: 41.7%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      background-color: transparent;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .name {
      position: absolute;
      top: 63.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 86%;
      text-align: center;
      font-family: "Tiro Bangla", serif;
      font-size: clamp(24px, 4.2vw, 38px);
      line-height: 1;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #151515;
    }

    .badge.dark .name { color: #f2f2f2; }

    @media (max-width: 900px) {
      .page {
        grid-template-columns: 1fr;
        padding: 32px 24px;
      }

      .form { max-width: 100%; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="form">
      <div class="block">
        <h2>Datos personales:</h2>
        <div class="field-label">Nombre y apellido</div>
        <input id="nameInput" type="text" placeholder="Escribe aquí" maxlength="36">
      </div>

      <div class="block">
        <h3>Imagen:</h3>
        <p>Sube tu foto para reconocerte:</p>
        <label class="upload-btn" for="photoInput">Subir</label>
        <input id="photoInput" type="file" accept="image/*">
        <div class="file-name" id="fileName"></div>
      </div>

      <div class="block">
        <h3>Color:</h3>
        <p>Elige el color que más te guste para personalizar tu tarjeta:</p>
        <div class="swatches">
          <button class="swatch white active" data-badge="badge-white.png" data-theme="light" aria-label="Blanco"></button>
          <button class="swatch pink" data-badge="badge-pink.png" data-theme="light" aria-label="Rosa"></button>
          <button class="swatch black" data-badge="badge-black.png" data-theme="dark" aria-label="Negro"></button>
          <button class="swatch blackpink" data-badge="badge-blackpink.png" data-theme="dark" aria-label="Negro rosa"></button>
        </div>
      </div>

      <button class="download-btn" id="downloadBtn">Descargar credencial</button>
      <button class="share-btn" id="shareBtn">Compartir en redes</button>
      <p class="share-help">Comparte tu credencial y etiqueta a @designopslatam usando #ConfOps26.</p>

      <div class="share-panel" id="sharePanel">
        <a class="social-link" id="instagramLink" href="https://www.instagram.com/" target="_blank">Instagram</a>
        <a class="social-link" id="facebookLink" target="_blank">Facebook</a>
        <a class="social-link" id="linkedinLink" target="_blank">LinkedIn</a>
        <a class="social-link" id="xLink" target="_blank">X</a>
        <a class="social-link" id="pinterestLink" target="_blank">Pinterest</a>
      </div>
    </section>

    <section class="preview-area">
      <div class="badge" id="badge">
        <img class="badge-bg" id="badgeBg" src="badge-white.png" alt="Credencial ConfOps26">
        <div class="photo" id="photoPreview"></div>
        <div class="name" id="namePreview">Nombre y apellido</div>
      </div>
    </section>
  </main>

  <script>
    const nameInput = document.getElementById("nameInput");
    const namePreview = document.getElementById("namePreview");
    const photoInput = document.getElementById("photoInput");
    const photoPreview = document.getElementById("photoPreview");
    const fileName = document.getElementById("fileName");
    const swatches = document.querySelectorAll(".swatch");
    const badgeBg = document.getElementById("badgeBg");
    const badge = document.getElementById("badge");
    const downloadBtn = document.getElementById("downloadBtn");
    const shareBtn = document.getElementById("shareBtn");
    const sharePanel = document.getElementById("sharePanel");

    const shareText = "Yo voy a la #ConfOps26";
    let uploadedImage = null;
    let lastGeneratedBlob = null;

    nameInput.addEventListener("input", () => {
      const value = nameInput.value.trim();
      namePreview.textContent = value || "Nombre y apellido";
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;

      fileName.textContent = file.name;

      const reader = new FileReader();

      reader.onload = () => {
        photoPreview.style.backgroundImage = `url("${reader.result}")`;

        uploadedImage = new Image();
        uploadedImage.onload = () => {};
        uploadedImage.src = reader.result;
      };

      reader.readAsDataURL(file);
    });

    swatches.forEach((swatch) => {
      swatch.addEventListener("click", () => {
        swatches.forEach((item) => item.classList.remove("active"));
        swatch.classList.add("active");

        badgeBg.src = swatch.dataset.badge;

        if (swatch.dataset.theme === "dark") {
          badge.classList.add("dark");
        } else {
          badge.classList.remove("dark");
        }
      });
    });

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    function drawCoverImage(ctx, image, x, y, width, height) {
      const imageRatio = image.width / image.height;
      const frameRatio = width / height;

      let drawWidth;
      let drawHeight;
      let drawX;
      let drawY;

      if (imageRatio > frameRatio) {
        drawHeight = height;
        drawWidth = height * imageRatio;
        drawX = x - (drawWidth - width) / 2;
        drawY = y;
      } else {
        drawWidth = width;
        drawHeight = width / imageRatio;
        drawX = x;
        drawY = y - (drawHeight - height) / 2;
      }

      ctx.drawImage(image, drawX, drawY, drawWidth, drawHeight);
    }

    async function generateCredentialCanvas() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const width = 1200;
      const height = 1500;

      canvas.width = width;
      canvas.height = height;

      const bgImage = await loadImage(badgeBg.src);
      ctx.drawImage(bgImage, 0, 0, width, height);

      if (uploadedImage) {
        const photoSize = width * 0.417;
        const photoX = width * 0.292;
        const photoY = height * 0.283;

        ctx.save();
        ctx.beginPath();
        ctx.arc(
          photoX + photoSize / 2,
          photoY + photoSize / 2,
          photoSize / 2,
          0,
          Math.PI * 2
        );
        ctx.closePath();
        ctx.clip();

        drawCoverImage(ctx, uploadedImage, photoX, photoY, photoSize, photoSize);
        ctx.restore();
      }

      await document.fonts.ready;

      const participantName = namePreview.textContent || "Nombre y apellido";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = badge.classList.contains("dark") ? "#f2f2f2" : "#151515";
      ctx.font = "76px 'Tiro Bangla', serif";

      const maxTextWidth = width * 0.86;
      let fontSize = 76;

      while (ctx.measureText(participantName).width > maxTextWidth && fontSize > 36) {
        fontSize -= 2;
        ctx.font = `${fontSize}px 'Tiro Bangla', serif`;
      }

      ctx.fillText(participantName, width / 2, height * 0.66);

      return canvas;
    }

    async function generateCredentialBlob() {
      const canvas = await generateCredentialCanvas();

      return new Promise((resolve) => {
        canvas.toBlob((blob) => {
          resolve(blob);
        }, "image/png");
      });
    }

    downloadBtn.addEventListener("click", async () => {
      const canvas = await generateCredentialCanvas();
      const link = document.createElement("a");
      link.download = "credencial-confops26.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    function updateFallbackShareLinks() {
      const encodedText = encodeURIComponent(shareText);
      const encodedUrl = encodeURIComponent(window.location.href);

      document.getElementById("facebookLink").href =
        `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}&quote=${encodedText}`;

      document.getElementById("linkedinLink").href =
        `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`;

      document.getElementById("xLink").href =
        `https://twitter.com/intent/tweet?text=${encodedText}&url=${encodedUrl}`;

      document.getElementById("pinterestLink").href =
        `https://www.pinterest.com/pin/create/button/?url=${encodedUrl}&description=${encodedText}`;
    }

    shareBtn.addEventListener("click", async () => {
      updateFallbackShareLinks();

      try {
        await navigator.clipboard.writeText(shareText);
      } catch (error) {}

      try {
        lastGeneratedBlob = await generateCredentialBlob();
        const file = new File([lastGeneratedBlob], "credencial-confops26.png", { type: "image/png" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: "ConfOps26",
            text: shareText,
            files: [file]
          });
          return;
        }

        if (navigator.share) {
          await navigator.share({
            title: "ConfOps26",
            text: shareText,
            url: window.location.href
          });
          return;
        }

        sharePanel.classList.add("active");
        alert("Caption copiado: Yo voy a la #ConfOps26");
      } catch (error) {
        sharePanel.classList.add("active");
        alert("Caption copiado: Yo voy a la #ConfOps26");
      }
    });

    updateFallbackShareLinks();
  </script>
</body>
</html>
