<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credencial ConfOps26</title>

<style>
body{
  margin:0;
  font-family: system-ui, -apple-system, sans-serif;
  background:#f5f5f5;
}

.container{
  display:flex;
  flex-wrap:wrap;
  gap:40px;
  padding:40px;
  align-items:flex-start;
}

/* PANEL IZQUIERDO */
.form{
  max-width:320px;
}

h2{
  font-size:28px;
  margin-bottom:10px;
}

label{
  display:block;
  font-weight:600;
  margin:20px 0 8px;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:16px;
}

/* BOTÓN SUBIR */
.upload-btn{
  padding:12px 20px;
  border-radius:12px;
  border:2px solid black;
  background:white;
  font-weight:600;
  cursor:pointer;
}

/* COLORES */
.colors{
  display:flex;
  gap:12px;
  margin-top:10px;
}

.color{
  width:40px;
  height:40px;
  border-radius:12px;
  cursor:pointer;
  border:2px solid transparent;
}

.color.active{
  border:3px solid black;
}

.gray{background:#ddd}
.pink{background:#ff4fa3}
.black{background:#111}
.gradient{background:linear-gradient(180deg,#000,#ff4fa3)}

/* BOTONES */
.main-btn{
  margin-top:30px;
  width:100%;
  padding:16px;
  background:#111;
  color:white;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.share{
  margin-top:10px;
  display:none;
}

/* TARJETA */
.preview{
  position:relative;
  width:380px;
}

.badge{
  width:100%;
}

/* FOTO (FIX FINAL) */
.photo{
  position:absolute;
  left:29.2%;
  top:28.3%;
  width:41.7%;
  aspect-ratio:1/1;
  border-radius:50%;
  overflow:hidden;
  line-height:0;
}

.photo img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  max-width:none;
  max-height:none;
  object-fit:cover;
  object-position:center;
  display:none;
}

/* NOMBRE */
.name{
  position:absolute;
  width:100%;
  bottom:90px;
  text-align:center;
  font-size:26px;
  font-weight:700;
}

/* MOBILE */
@media(max-width:768px){
  .container{
    flex-direction:column;
    align-items:center;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- FORM -->
  <div class="form">
    <h2>Datos personales:</h2>

    <label>Nombre y apellido</label>
    <input id="nameInput" placeholder="Escribe aquí">

    <label>Imagen:</label>
    <button class="upload-btn" onclick="fileInput.click()">Subir</button>
    <input type="file" id="fileInput" hidden>

    <label>Color:</label>
    <div class="colors">
      <div class="color gray active" data-img="badge-white.png"></div>
      <div class="color pink" data-img="badge-pink.png"></div>
      <div class="color black" data-img="badge-black.png"></div>
      <div class="color gradient" data-img="badge-blackpink.png"></div>
    </div>

    <button class="main-btn" onclick="download()">Descargar credencial</button>
    <button class="main-btn share" id="shareBtn" onclick="share()">Compartir en redes</button>
  </div>

  <!-- PREVIEW -->
  <div class="preview" id="capture">
    <img id="badge" class="badge" src="badge-white.png">
    <div class="photo">
      <img id="photoPreview">
    </div>
    <div class="name" id="namePreview">Nombre y apellido</div>
  </div>

</div>

<!-- LIB -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
const nameInput = document.getElementById("nameInput");
const namePreview = document.getElementById("namePreview");
const fileInput = document.getElementById("fileInput");
const photoPreview = document.getElementById("photoPreview");
const badge = document.getElementById("badge");
const shareBtn = document.getElementById("shareBtn");

/* NOMBRE */
nameInput.addEventListener("input",()=>{
  namePreview.textContent = nameInput.value || "Nombre y apellido";
});

/* FOTO */
fileInput.addEventListener("change",(e)=>{
  const file = e.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = ()=>{
      photoPreview.src = reader.result;
      photoPreview.style.display="block";
    }
    reader.readAsDataURL(file);
  }
});

/* COLOR */
document.querySelectorAll(".color").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".color").forEach(c=>c.classList.remove("active"));
    btn.classList.add("active");
    badge.src = btn.dataset.img;
  }
});

/* DESCARGA (FIX MOBILE) */
async function download(){
  const canvas = await html2canvas(document.getElementById("capture"),{
    useCORS:true,
    scale:3
  });

  const link = document.createElement("a");
  link.download = "credencial.png";
  link.href = canvas.toDataURL("image/png");

  link.click();

  shareBtn.style.display="block";
}

/* SHARE */
function share(){
  const text = encodeURIComponent("Yo voy a la #ConfOps26 🚀");
  window.open(`https://twitter.com/intent/tweet?text=${text}`);
}
</script>

</body>
</html>
